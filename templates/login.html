<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>登录</title>

<style>
body {
    background: linear-gradient(135deg,#74ebd5,#9face6);
    font-family: Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card {
    background:white;
    padding:30px;
    border-radius:12px;
    width:300px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

input {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    width:100%;
    padding:10px;
    background:#4CAF50;
    color:white;
    border:none;
    cursor:pointer;
}

.link {
    text-align:center;
    margin-top:10px;
    cursor:pointer;
    color:blue;
}
</style>
</head>

<body>

<div class="card">
    <h2>登录</h2>

    <input id="username" placeholder="用户名">
    <input id="password" type="password" placeholder="密码">

    <button onclick="login()">登录</button>

    <p id="msg"></p>

    <div class="link" onclick="goRegister()">没有账号？去注册</div>
</div>

<script>
function login(){
    fetch('/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            username:username.value,
            password:password.value
        })
    })
    .then(res=>res.json())
    .then(data=>{
        msg.innerText = data.msg
        if(data.msg==="登录成功"){
            location.href = "/"
        }
    })
}

function goRegister(){
    location.href = "/register_page"
}
</script>

</body>
</html>
